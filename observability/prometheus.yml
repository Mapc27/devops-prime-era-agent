global:
  scrape_interval: 10s
  evaluation_interval: 10s
rule_files: [/etc/prometheus/rules/*.yml]
alerting:
  alertmanagers: [{static_configs: [{targets: ["alertmanager:9093"]}]}]
scrape_configs:
  - job_name: api
    static_configs: [{targets: ["api:8000"]}]
  - job_name: worker
    static_configs: [{targets: ["worker:9100"]}]
  - job_name: lab-control
    static_configs: [{targets: ["lab-control:8090"]}]
  - job_name: postgres
    static_configs: [{targets: ["postgres-exporter:9187"]}]
  - job_name: redis
    static_configs: [{targets: ["redis-exporter:9121"]}]
  - job_name: opscrew
    static_configs: [{targets: ["agent:8080"]}]
  - job_name: ops-tools
    static_configs: [{targets: ["ops-tools:8070"]}]
