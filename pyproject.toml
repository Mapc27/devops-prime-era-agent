[project]
name = "opscrew"
version = "0.1.0"
description = "Ops Crew — multi-agent SRE assistant on local LLMs"
requires-python = ">=3.12,<3.13"
dependencies = [
  "langgraph>=0.6",
  "langchain-core>=0.3",
  "langchain-ollama>=0.3",
  "langchain-openai>=0.3",
  "langchain-mcp-adapters>=0.1",
  "mcp>=1.10",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pyyaml>=6",
  "numpy>=1.26",
  "rank-bm25>=0.2",
  "prometheus-client>=0.20",
  "opentelemetry-sdk>=1.25",
  "opentelemetry-exporter-otlp>=1.25",
  "openinference-instrumentation-langchain>=0.1",
  "typer>=0.12",
  "rich>=13",
  "langgraph-checkpoint-sqlite>=3.1.1",
  "aiosqlite>=0.22.1",
]

[project.scripts]
opscrew = "opscrew.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "markdown>=3.6",
    "psutil>=5.9",
    "fastapi>=0.143.0",
    "matplotlib>=3.11.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["opscrew"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
