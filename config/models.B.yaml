engine: {kind: ollama, num_ctx: 12288, keep_alive: 30m}
roles:
  router:    {model: "tev1:4b",       family: qwen,   kind: decision, tier: L0}
  light:     {model: "ornith:9b",     family: qwen,   kind: chat, tier: L1}
  heavy:     {model: "gemma4:26b",    family: google, kind: chat, tier: L2, num_ctx: 12288}
  validator: {model: "granite4.2:8b", family: ibm,    kind: chat, tier: V}
  embed:     {model: "embeddinggemma-2", family: google, kind: embed}
  cloud:     {model: "gemini-flash-latest", family: google, kind: chat, tier: L3, enabled: false, base_url: "https://generativelanguage.googleapis.com/v1beta/openai/", api_key_env: GEMINI_API_KEY}
workers: [light, heavy]
routing: {simple: light, complex: heavy, confidence_threshold: 0.6, fallback: {heavy: [light, cloud], light: [heavy, cloud], validator: [light]}}
pricing: {"tev1:4b": [0.042, 0.0], "ornith:9b": [0.05, 0.10], "gemma4:26b": [0.15, 0.60], "granite4.2:8b": [0.05, 0.10]}
