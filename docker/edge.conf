events {}
http {
  access_log off;
  # re-resolve container names via Docker DNS (containers get new IPs on restart)
  resolver 127.0.0.11 valid=5s ipv6=off;
  # ingress: host -> agent API
  server {
    listen 8080;
    location / { set $agent http://agent:8080; proxy_pass $agent; proxy_read_timeout 900s; }
  }
  # egress: agent -> Ollama on the host (the only external destination the agent can reach)
  server {
    listen 11434;
    location / { proxy_pass http://host.docker.internal:11434; proxy_read_timeout 900s; proxy_buffering off; }
  }
}
