events {}
http {
  log_format json escape=json '{"ts":"$time_iso8601","service":"nginx","status":$status,"path":"$uri","upstream_status":"$upstream_status","rt":$request_time}';
  access_log /dev/stdout json;
  error_log /dev/stderr warn;
  # re-resolve api via Docker DNS: the api container gets a new IP after every restart/rollback
  resolver 127.0.0.11 valid=5s ipv6=off;
  server {
    listen 80;
    location /api/ {
      set $api_upstream http://api:8000;
      rewrite ^/api/(.*)$ /$1 break;
      proxy_pass $api_upstream;
      proxy_read_timeout 3s;
      proxy_connect_timeout 1s;
    }
    location /nginx_status { stub_status; }
  }
}
